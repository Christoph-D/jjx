name: Integration Tests

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute the test shards on (e.g. ubuntu-latest, macos-latest, windows-latest)
        type: string
        required: true
      report-name:
        description: Artifact name for the merged Playwright HTML report
        type: string
        required: true

jobs:
  playwright:
    runs-on: ${{ inputs.runner }}

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache jj (Linux)
        id: cache-jj-linux
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/bin/jj
            /usr/local/bin/jj-0.38
          key: jj-v0.44.0-v0.38.0-Linux-x86_64

      - name: Install jj (Linux)
        if: runner.os == 'Linux' && steps.cache-jj-linux.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/jj-vcs/jj/releases/download/v0.44.0/jj-v0.44.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/jj.tar.gz
          echo "0a07bab4641a55fd2bc2fd1563ba3a3f9a577584086ad74086a1c5b69b3ffce9  /tmp/jj.tar.gz" | sha256sum -c
          tar xz -C /usr/local/bin ./jj -f /tmp/jj.tar.gz

          # Older jj used by some integration tests.
          curl -L https://github.com/jj-vcs/jj/releases/download/v0.38.0/jj-v0.38.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/jj-0.38.tar.gz
          echo "ed830d9a34a304f8ba258806b52521250a9fffded32ae89c4eb5285b33556a17  /tmp/jj-0.38.tar.gz" | sha256sum -c
          tar xz -C /tmp ./jj -f /tmp/jj-0.38.tar.gz
          mv /tmp/jj /usr/local/bin/jj-0.38

      - name: Cache jj (macOS)
        id: cache-jj-macos
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/jj
          key: jj-v0.44.0-macOS-aarch64

      - name: Install jj (macOS)
        if: runner.os == 'macOS' && steps.cache-jj-macos.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/jj-vcs/jj/releases/download/v0.44.0/jj-v0.44.0-aarch64-apple-darwin.tar.gz -o /tmp/jj.tar.gz
          echo "22b92ed109378a9638f0ae55ca7a7bdc9ef26aa60124215a1f04f6808623ba94  /tmp/jj.tar.gz" | shasum -a 256 -c
          tar xzf /tmp/jj.tar.gz -C /usr/local/bin ./jj

      - name: Cache jj (Windows)
        id: cache-jj-windows
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: C:\jj\jj.exe
          key: jj-v0.44.0-Windows-x86_64

      - name: Install jj (Windows)
        if: runner.os == 'Windows' && steps.cache-jj-windows.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest -Uri https://github.com/jj-vcs/jj/releases/download/v0.44.0/jj-v0.44.0-x86_64-pc-windows-msvc.zip -OutFile jj.zip
          $hash = (Get-FileHash -Path jj.zip -Algorithm SHA256).Hash
          if ($hash -ne 'a33732415db40e84f43c911b04751cf88aa2c7a5d12ea86bec3ac18f23f463fd') { throw "SHA256 mismatch" }
          Expand-Archive -Path jj.zip -DestinationPath C:\jj

      - name: Add jj to PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "C:\jj" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build extension
        run: pnpm run build

      - name: Playwright tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: pnpm exec playwright test --config=tests-integration/playwright.config.ts --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: tests-integration/blob-report/
          retention-days: 1

  merge-reports:
    needs: playwright
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v6
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright reports
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.report-name }}
          path: playwright-report/
          retention-days: 30
