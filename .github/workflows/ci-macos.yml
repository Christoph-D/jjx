name: CI (macOS)

# macOS tests are run manually.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run unit-test

  playwright:
    needs: build
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache jj
        id: cache-jj
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/jj
          key: jj-v0.44.0-${{ runner.os }}-aarch64

      - name: Install jj
        if: steps.cache-jj.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/jj-vcs/jj/releases/download/v0.44.0/jj-v0.44.0-aarch64-apple-darwin.tar.gz -o /tmp/jj.tar.gz
          echo "22b92ed109378a9638f0ae55ca7a7bdc9ef26aa60124215a1f04f6808623ba94  /tmp/jj.tar.gz" | shasum -a 256 -c
          tar xzf /tmp/jj.tar.gz -C /usr/local/bin ./jj

      - name: Build extension
        run: pnpm run build

      - name: Playwright tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: pnpm exec playwright test --config=tests-integration/playwright.config.ts --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: tests-integration/blob-report/
          retention-days: 1

  merge-reports:
    needs: playwright
    if: ${{ !cancelled() }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v6
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright reports
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts-macos
          path: playwright-report/
          retention-days: 30
