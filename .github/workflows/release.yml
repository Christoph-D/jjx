name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      report-name: playwright-artifacts

  release:
    needs: ci
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Package extension
        run: pnpm run package

      - name: Get version info
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          VSIX_NAME="jjx-${VERSION}.vsix"
          echo "vsix_name=${VSIX_NAME}" >> $GITHUB_OUTPUT

      - name: Extract release notes
        run: |
          awk '/^## /{if(p) exit; p=1; next} p{if(NF || started) print; if(NF) started=1}' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.vsix_name }}
          body_path: release-notes.md

      - name: Publish to VS Code Marketplace
        run: pnpm run publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
