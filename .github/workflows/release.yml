name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run unit-test

  playwright:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache jj
        id: cache-jj
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/bin/jj
            /usr/local/bin/jj-0.38
          key: jj-v0.44.0-v0.38.0-${{ runner.os }}-x86_64

      - name: Install jj
        if: steps.cache-jj.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/jj-vcs/jj/releases/download/v0.44.0/jj-v0.44.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/jj.tar.gz
          echo "0a07bab4641a55fd2bc2fd1563ba3a3f9a577584086ad74086a1c5b69b3ffce9  /tmp/jj.tar.gz" | sha256sum -c
          tar xz -C /usr/local/bin ./jj -f /tmp/jj.tar.gz

          # Older jj used by some integration tests.
          curl -L https://github.com/jj-vcs/jj/releases/download/v0.38.0/jj-v0.38.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/jj-0.38.tar.gz
          echo "ed830d9a34a304f8ba258806b52521250a9fffded32ae89c4eb5285b33556a17  /tmp/jj-0.38.tar.gz" | sha256sum -c
          tar xz -C /tmp ./jj -f /tmp/jj-0.38.tar.gz
          mv /tmp/jj /usr/local/bin/jj-0.38

      - name: Build extension
        run: pnpm run build

      - name: Playwright tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: pnpm exec playwright test --config=tests-integration/playwright.config.ts --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: tests-integration/blob-report/
          retention-days: 1

  merge-reports:
    needs: playwright
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v6
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright reports
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: playwright-report/
          retention-days: 30

  release:
    needs: playwright
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Package extension
        run: pnpm run package

      - name: Get version info
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          VSIX_NAME="jjx-${VERSION}.vsix"
          echo "vsix_name=${VSIX_NAME}" >> $GITHUB_OUTPUT

      - name: Extract release notes
        run: |
          awk '/^## /{if(p) exit; p=1; next} p{if(NF || started) print; if(NF) started=1}' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.vsix_name }}
          body_path: release-notes.md

      - name: Publish to VS Code Marketplace
        run: pnpm run publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
