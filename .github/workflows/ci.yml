name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      report-name:
        description: Artifact name for the merged Playwright HTML report
        type: string
        default: playwright-report

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run unit-test

  integration-tests:
    needs: build
    uses: ./.github/workflows/integration-tests.yml
    with:
      runner: ubuntu-latest
      report-name: ${{ inputs.report-name || 'playwright-report' }}
