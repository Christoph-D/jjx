name: CI (Windows)

# Windows tests are flaky, so this workflow is only run manually.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run unit-test

  playwright:
    needs: build
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache jj
        id: cache-jj
        uses: actions/cache@v5
        with:
          path: C:\jj\jj.exe
          key: jj-v0.44.0-${{ runner.os }}-x86_64

      - name: Install jj
        if: steps.cache-jj.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest -Uri https://github.com/jj-vcs/jj/releases/download/v0.44.0/jj-v0.44.0-x86_64-pc-windows-msvc.zip -OutFile jj.zip
          $hash = (Get-FileHash -Path jj.zip -Algorithm SHA256).Hash
          if ($hash -ne 'a33732415db40e84f43c911b04751cf88aa2c7a5d12ea86bec3ac18f23f463fd') { throw "SHA256 mismatch" }
          Expand-Archive -Path jj.zip -DestinationPath C:\jj

      - name: Add jj to PATH
        run: echo "C:\jj" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build extension
        run: pnpm run build

      - name: Playwright tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: pnpm exec playwright test --config=tests-integration/playwright.config.ts --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: tests-integration/blob-report/
          retention-days: 1

  merge-reports:
    needs: playwright
    if: ${{ !cancelled() }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v6
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright reports
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts-windows
          path: playwright-report/
          retention-days: 30
